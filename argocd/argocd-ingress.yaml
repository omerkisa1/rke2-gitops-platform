apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: {{ .Values.argocd.namespace }}
spec:
  ingressClassName: {{ .Values.argocd.ingressClass }}
  rules:
  - host: {{ .Values.argocd.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.argocd.serviceName }}
            port:
              number: {{ .Values.argocd.servicePort }}
