apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/omerkisa1/rke2-gitops-platform
    targetRevision: HEAD
    path: istio-manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
