django:
  replicaCount: 1
  image:
    repository: omerkisa1/django-web
    tag: k8s
    pullPolicy: Always
  port: 8000

postgres:
  image:
    repository: postgres
    tag: 16-alpine
  port: 5432

secrets:
  postgresUser: YWRtaW4=
  postgresPassword: YWRtaW4=

ingress:
  enabled: true
  className: nginx
  path: /

jenkins:
  namespace: jenkins
  ingressClass: nginx
  host: jenkins.omerkisa.com
  serviceName: jenkins
  servicePort: 8080

argocd:
  namespace: argocd
  ingressClass: nginx
  host: argocd.omerkisa.com
  serviceName: argocd-server
  servicePort: 80
